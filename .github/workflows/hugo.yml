name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Installer Hugo
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v5

      # Évite de redimensionner toutes les photos à chaque déploiement
      - name: Cache des images redimensionnées
        uses: actions/cache@v4
        with:
          path: '*/resources/_gen'
          key: hugo-gen-${{ hashFiles('*/content/**/*.jpg', '*/content/**/*.jpeg', '*/content/**/*.png', '*/hugo.toml') }}
          restore-keys: hugo-gen-

      # Chaque sous-répertoire contenant un hugo.toml est un trek,
      # publié dans /<répertoire>/ ; index.html à la racine est copié tel quel.
      - name: Construire les treks
        env:
          HUGO_ENVIRONMENT: production
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site
          cp index.html robots.txt _site/
          for cfg in */hugo.toml; do
            trek="$(dirname "$cfg")"
            [ "$trek" = themes ] && continue
            echo "::group::Trek $trek"
            hugo --source "$trek" --gc --minify \
              --baseURL "${BASE_URL}/${trek}/" \
              --destination "$GITHUB_WORKSPACE/_site/$trek"
            echo "::endgroup::"
            sitemaps+="  <sitemap><loc>${BASE_URL}/${trek}/sitemap.xml</loc></sitemap>"$'\n'
          done
          # Index des sitemaps de tous les treks (référencé par robots.txt)
          printf '<?xml version="1.0" encoding="utf-8"?>\n<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n%s</sitemapindex>\n' "$sitemaps" > _site/sitemap.xml

      - name: Publier l'artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
