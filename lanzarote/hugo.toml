# baseURL est écrasé au déploiement par GitHub Actions (voir .github/workflows/hugo.yml)
baseURL = "https://slowtrek.github.io/lanzarote/"

# Gabarits communs à tous les treks : ../themes/carnet
theme = "carnet"
themesDir = "../themes"
locale = "fr-FR"
defaultContentLanguage = "fr"
title = "Lanzarote"
timeZone = "Atlantic/Canary"
disableKinds = ["taxonomy", "term"]

[params]
  contact = "slowtrek@duck.com"
  description = "Carnet de randonnée itinérante : la traversée de Lanzarote à pied."
  # Seuil (m) en dessous duquel les variations d'altitude sont ignorées (bruit GPS)
  seuilDenivele = 3

[imaging]
  quality = 80
  resampleFilter = "Lanczos"
  anchor = "Smart"

[outputs]
  home = ["html"]
  section = ["html"]
