# baseURL est écrasé au déploiement par GitHub Actions (voir .github/workflows/hugo.yml)
baseURL = "https://slowtrek.github.io/lanzarote/"

# Gabarits communs à tous les treks : ../themes/carnet
theme = "carnet"
themesDir = "../themes"
locale = "fr-FR"
defaultContentLanguage = "fr"
title = "Découvrir Lanzarote à pied en une semaine"
timeZone = "Atlantic/Canary"
disableKinds = ["taxonomy", "term"]

[params]
  contact = "slowtrek@duck.com"
  description = "Carnet de randonnée itinérante : la traversée de Lanzarote à pied."
  # Référencement : lieu, code région ISO 3166-2 et mots-clés communs à toutes les pages
  lieu = "Lanzarote, îles Canaries, Espagne"
  geoRegion = "ES-CN"
  # Code fourni par Google Search Console (méthode « balise HTML »), facultatif
  # Identifiant Google Tag Manager (actif seulement sur le site publié)
  googleTagManager = "GTM-N9HDPXB4"
  googleVerification = "YQAqXpHSooSqrd5ik8jRGonSXdAHNhIWq1ZJ7J4E0hU"
  motsCles = ["Lanzarote", "randonnée", "trek", "randonnée itinérante", "îles Canaries", "à pied", "carnet de voyage", "GPX", "César Manrique", "volcans"]
  # Seuil (m) en dessous duquel les variations d'altitude sont ignorées (bruit GPS)
  seuilDenivele = 3
  # Largeur (m) de la moyenne glissante appliquée aux altitudes avant le calcul du D+/D-
  lissageDenivele = 150

[imaging]
  quality = 80
  resampleFilter = "Lanczos"
  anchor = "Smart"

[outputs]
  home = ["html"]
  section = ["html"]
